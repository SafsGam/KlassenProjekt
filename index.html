<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Aufgabenliste</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Aufgabenliste</h1>
        <ul id="list"></ul>
        <script>
            fetch("tasks.php")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("list");
                data.forEach(task => {
                    const li = document.createElement("li");
                    li.textContent = task.title;
                    list.appendChild(li);
                });
            });
        </script>
    </body>
</html>
